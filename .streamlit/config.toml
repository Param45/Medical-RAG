[theme]
primaryColor = "#0284c7"
backgroundColor = "#0b0f17"
secondaryBackgroundColor = "#111827"
textColor = "#f8fafc"
font = "sans serif"

[client]
toolbarMode = "minimal"
# Errors surfaced as a bare "Oh no" with no detail make every failure in this app
# undiagnosable, including ones the operator needs to see (a backend that is down,
# a missing index, an expired key). Shown in full for the demo; narrow this if the
# app is ever exposed to users who should not see internals.
showErrorDetails = true

[browser]
gatherUsageStats = false
